<script>
/* ============================================================
   סבב 2 — המרדף האישי
   ============================================================ */
const LETTERS = ['א', 'ב', 'ג'];

/* האם הצ׳ייסר יודע את התשובה? רמת הקושי + הטיה לפי נושא */
function chaserKnows(q){
  const bias = (CHASER_BIAS[state.chaser.key] || {})[q.cat] || 0;
  return Math.random() < clamp(state.chaser.accuracy + bias, .05, .98);
}
function chaserChoice(q){
  if (chaserKnows(q)) return q.shuffled.indexOf(q.a);
  const wrong = q.shuffled.map((o, i) => i).filter(i => q.shuffled[i] !== q.a);
  return wrong[Math.floor(Math.random() * wrong.length)];
}

Screens.chase = {
  html(){
    const p = state.players[state.current];
    let slots = '';
    for (let i = 0; i <= HOME; i++){
      const cls = i === 0 ? 'chaserrow' : (i === HOME ? 'home' : '');
      const label = i === 0
        ? '<span class="lbl-full">הצ׳ייסר</span>'
        : (i === HOME
            ? '<span class="lbl-full">🏠 הבית</span><span class="lbl-short">🏠</span>'
            : String(i));
      slots += `<div class="slot ${cls}" data-slot="${i}">
                  <div class="lane lane-c"></div><div>${label}</div><div class="lane lane-p"></div>
                </div>`;
    }
    const hostPanel = state.hostMode === 'human' ? `
      <div class="panel panel-pad mt-3" id="hostpanel">
        <div class="spread mb-2">
          <b>🎤 תשובת הצ׳ייסר — למנחה בלבד</b>
          <span class="muted text-xs">השחקנים לא רואים את הבחירה עד הגילוי</span>
        </div>
        <div class="grid gap-2 sm:grid-cols-3">
          ${LETTERS.map((l, i) => `<button class="btn btn-lg" data-cpick="${i}">${l}</button>`).join('')}
        </div>
      </div>` : '';

    return `
    ${topBar('המרדף האישי', esc(p.name) + ' · ' + state.chaser.title)}
    <div class="grid gap-3 split">

      <div class="panel panel-pad">
        <div class="spread mb-2">
          <span class="chip chip-gold">על הכף: ${money(p.offer.prize)}</span>
          <span class="chip" id="qcount">שאלה 1</span>
        </div>
        <div class="board" id="board">${slots}</div>
        <div class="spread mt-2 text-xs muted">
          <span class="chip chip-chaser">צ׳ייסר: <b id="cgap" class="num">0</b> צעדים ממך</span>
          <span class="chip chip-player">עד הבית: <b id="pgap" class="num">0</b></span>
        </div>
      </div>

      <div class="grid gap-3 content-start">
        <div class="panel panel-pad grid gap-3">
          <div class="spread">
            <span class="chip" id="qcat">—</span>
            <span class="chip chip-gold hidden" id="lockchip">נותרו <b id="lockn" class="num">${LOCK_SECONDS}</b> שניות</span>
          </div>
          <div class="qtext" id="q">…</div>
          <div class="muted text-sm" id="hint">בחרו תשובה. ברגע שאחד הצדדים נועל — מתחילה ספירה של ${LOCK_SECONDS} שניות.</div>
        </div>
        <div class="grid gap-2" id="opts"></div>
        <div class="row justify-center">
          <span class="chip chip-player hidden" id="plocked">🔒 נעלתם תשובה</span>
          <span class="chip chip-chaser hidden" id="clocked">🔒 הצ׳ייסר נעל תשובה</span>
        </div>
        ${hostPanel}
      </div>
    </div>`;
  },

  mount(){
    mountTopBar();
    const p = state.players[state.current];
    const st = state.chase = {
      pos: p.offer.start, cpos: 0, prize: p.offer.prize,
      q: null, pPick: null, cPick: null, phase: 'idle', qn: 0, aiTimer: null, lockClock: null
    };

    /* ---------- הלוח ---------- */
    const slot = i => $(`[data-slot="${i}"]`);
    const tokP = document.createElement('div');
    tokP.className = 'tok tok-p'; tokP.id = 'tok-p';
    tokP.innerHTML = `<span class="tok-full">${esc(p.name)}</span><span class="tok-short">🔵</span>`;
    const tokC = document.createElement('div');
    tokC.className = 'tok tok-c'; tokC.id = 'tok-c';
    tokC.innerHTML = '<span class="tok-full">צ׳ייסר</span><span class="tok-short">😈</span>';
    slot(st.pos).querySelector('.lane-p').appendChild(tokP);
    slot(st.cpos).querySelector('.lane-c').appendChild(tokC);

    const gaps = () => {
      $('#cgap').textContent = st.pos - st.cpos;
      $('#pgap').textContent = HOME - st.pos;
      $$('.slot').forEach(s => s.classList.toggle('hot', +s.dataset.slot === st.pos));
    };
    const move = (who, to) => {
      const tok = who === 'p' ? tokP : tokC;
      const lane = who === 'p' ? '.lane-p' : '.lane-c';
      flipMove(tok, () => slot(to).querySelector(lane).appendChild(tok));
      tok.classList.remove('pop'); void tok.offsetWidth; tok.classList.add('pop');
      who === 'p' ? Sound.stepPlayer() : Sound.stepChaser();
    };
    gaps();

    /* ---------- שאלה ---------- */
    const optsEl = $('#opts');
    const paintOpts = () => {
      optsEl.innerHTML = st.q.shuffled.map((o, i) => `
        <button class="opt" data-pick="${i}">
          <span class="badge">${LETTERS[i]}</span>
          <span>${esc(o)}</span>
          <span class="who"></span>
        </button>`).join('');
      bind('[data-pick]', 'click', e => playerPick(+e.currentTarget.dataset.pick), optsEl);
    };

    const ask = () => {
      st.qn++; st.pPick = null; st.cPick = null; st.phase = 'answering';
      st.q = nextQuestion();
      $('#qcount').textContent = 'שאלה ' + st.qn;
      $('#qcat').textContent = CATS[st.q.cat].icon + ' ' + CATS[st.q.cat].name;
      $('#q').textContent = st.q.q;
      $('#hint').textContent = `בחרו תשובה. ברגע שאחד הצדדים נועל — מתחילה ספירה של ${LOCK_SECONDS} שניות.`;
      const pl = $('#plocked'), cl = $('#clocked');
      pl.textContent = '🔒 נעלתם תשובה'; pl.classList.add('hidden');
      cl.textContent = '🔒 הצ׳ייסר נעל תשובה'; cl.classList.add('hidden');
      $('#lockchip').classList.add('hidden');
      $$('[data-cpick]').forEach(b => { b.disabled = false; b.classList.remove('btn-gold'); });
      paintOpts();
      if (state.hostMode === 'ai'){
        st.aiTimer = addTimeout(() => aiAnswer(), T(rnd(2200, 6500)));
      }
      /* רשת ביטחון — שלא ייתקע אם אף אחד לא נועל */
      const thisQ = st.qn;
      addTimeout(() => { if (st.phase === 'answering' && st.qn === thisQ) resolve(); }, T(32000));
    };

    const mark = (i, who) => {
      const btn = optsEl.querySelector(`[data-pick="${i}"]`);
      if (!btn) return;
      btn.classList.add(who === 'p' ? 'pick-p' : 'pick-c');
      const chip = who === 'p' ? '<span class="chip chip-player">אתם</span>'
                               : '<span class="chip chip-chaser">צ׳ייסר</span>';
      btn.querySelector('.who').insertAdjacentHTML('beforeend', chip);
    };

    function startLock(){
      if (st.lockClock) return;
      $('#lockchip').classList.remove('hidden');
      st.lockClock = new Clock(LOCK_SECONDS * 1000, {
        onSecond: s => { $('#lockn').textContent = Math.max(0, s); if (s > 0 && s <= LOCK_SECONDS) Sound.tick(s <= 2); },
        onEnd: () => resolve()
      }).start();
    }

    function playerPick(i){
      if (st.phase !== 'answering' || st.pPick !== null) return;
      st.pPick = i; mark(i, 'p'); Sound.lock();
      $('#plocked').classList.remove('hidden');
      optsEl.querySelectorAll('.opt').forEach(b => b.disabled = true);
      if (st.cPick === null){
        startLock();
        /* הצ׳ייסר הממוחשב חייב לנעול בתוך חלון הספירה */
        if (state.hostMode === 'ai' && st.aiTimer){
          clearTimeout(st.aiTimer); live.timeouts.delete(st.aiTimer);
          st.aiTimer = addTimeout(() => aiAnswer(), T(rnd(900, 4300)) * (LOCK_SECONDS / 5));
        }
      } else resolve();
    }

    function chaserPick(i){
      if (st.phase !== 'answering' || st.cPick !== null) return;
      st.cPick = i; Sound.lock();
      $('#clocked').classList.remove('hidden');
      $$('[data-cpick]').forEach(b => { b.disabled = true; b.classList.toggle('btn-gold', +b.dataset.cpick === i); });
      if (st.pPick === null) startLock(); else resolve();
    }
    function aiAnswer(){ chaserPick(chaserChoice(st.q)); }

    /* ---------- גילוי התשובות ---------- */
    async function resolve(){
      if (st.phase !== 'answering') return;
      st.phase = 'reveal';
      if (st.lockClock){ st.lockClock.stop(); st.lockClock = null; }
      if (st.aiTimer){ clearTimeout(st.aiTimer); live.timeouts.delete(st.aiTimer); st.aiTimer = null; }
      $('#lockchip').classList.add('hidden');
      optsEl.querySelectorAll('.opt').forEach(b => b.disabled = true);
      $$('[data-cpick]').forEach(b => b.disabled = true);

      /* מי שלא נעל בזמן — נחשב כטועה */
      if (st.cPick === null && state.hostMode === 'ai') st.cPick = chaserChoice(st.q);

      await sleep(450);
      if (st.cPick !== null){
        mark(st.cPick, 'c');
        $('#clocked').classList.remove('hidden');
      } else {
        $('#clocked').textContent = '⏱ הצ׳ייסר לא נעל בזמן';
        $('#clocked').classList.remove('hidden');
      }
      if (st.pPick === null){
        $('#plocked').textContent = '⏱ לא נעלתם בזמן';
        $('#plocked').classList.remove('hidden');
      }

      await sleep(750);
      const correct = st.q.shuffled.indexOf(st.q.a);
      optsEl.querySelectorAll('.opt').forEach((b, i) => {
        if (i === correct) b.classList.add('right');
        else if (i === st.pPick || i === st.cPick) b.classList.add('wrongpick');
      });
      const pOK = st.pPick === correct, cOK = st.cPick === correct;
      pOK ? Sound.correct() : Sound.wrong();
      $('#hint').innerHTML = `${pOK ? '<b class="text-green-300">עניתם נכון!</b>' : '<b class="text-red-300">לא נכון.</b>'}
        ${cOK ? ' הצ׳ייסר צדק והתקרב.' : ' הצ׳ייסר טעה ונשאר במקום.'}`;

      await sleep(850);
      if (pOK) { st.pos++; move('p', st.pos); }
      await sleep(pOK ? 350 : 0);
      if (cOK) { st.cpos++; move('c', st.cpos); }
      gaps();

      await sleep(800);
      if (st.pos >= HOME) return finish('home');
      if (st.cpos >= st.pos) return finish('caught');
      ask();
    }

    /* ---------- סיום המרדף ---------- */
    function finish(kind){
      st.phase = 'done';
      Sound.musicStop();
      if (kind === 'home'){
        p.status = 'safe';
        p.won = st.prize;
        Sound.win();
        overlay(`
          <div class="eyebrow mb-2">הגעתם הביתה</div>
          <div class="big logo">${money(st.prize)}</div>
          <div class="muted mt-3">${esc(p.name)} עבר/ה למרדף הסופי 🎉</div>`);
      } else {
        p.status = 'out';
        p.won = 0;
        Sound.caught();
        $('#board').classList.add('shake');
        overlay(`
          <div class="eyebrow mb-2">נתפסתם!</div>
          <div class="big" style="color:#fca5a5">😈</div>
          <div class="text-2xl font-black mt-2">${esc(p.name)} יוצא/ת מהמשחק</div>
          <div class="muted mt-1">${money(st.prize)} נשארו אצל הצ׳ייסר</div>`);
      }
      addTimeout(nextPlayer, T(2800));
    }

    function nextPlayer(){
      state.current++;
      if (state.current < state.players.length) go('ready');
      else go('finalIntro');
    }

    if (state.hostMode === 'human') bind('[data-cpick]', 'click', e => chaserPick(+e.currentTarget.dataset.cpick));
    onKeys({
      Digit1: () => playerPick(0), Digit2: () => playerPick(1), Digit3: () => playerPick(2),
      KeyA:   () => playerPick(0), KeyS:   () => playerPick(1), KeyD:   () => playerPick(2)
    });

    Sound.musicStart(1);
    addCleanup(() => Sound.musicStop());
    ask();
  }
};
</script>
<script>
/* ============================================================
   סבב 3 — המרדף הסופי
   ============================================================ */
function survivors(){ return state.players.filter(p => p.status === 'safe'); }

Screens.finalIntro = {
  html(){
    const s = survivors();
    state.teamBank = s.reduce((t, p) => t + (p.won || 0), 0);
    if (!s.length){
      return `
      ${topBar('המרדף הסופי', 'לא נותר אף אחד')}
      <div class="panel panel-pad text-center grid gap-4 py-12">
        <div class="big">😈</div>
        <h2 class="logo text-4xl">הצ׳ייסר תפס את כולם</h2>
        <p class="muted">אין קבוצה שתשחק את המרדף הסופי. הקופה נשארת אצלו.</p>
        <div class="row justify-center"><button class="btn btn-gold btn-xl" id="f-skip">לתוצאות</button></div>
      </div>`;
    }
    return `
    ${topBar('המרדף הסופי', 'הסבב האחרון')}
    <div class="panel panel-pad text-center grid gap-4 py-8">
      <div class="eyebrow">הקופה המשותפת</div>
      <div class="logo text-6xl">${money(state.teamBank)}</div>
      <div class="row justify-center">${s.map(p => `<span class="chip chip-gold">${esc(p.name)} · ${money(p.won)}</span>`).join(' ')}</div>
      <p class="muted max-w-xl mx-auto">
        אתם מתחילים עם <b class="text-sky-300">${s.length} ${s.length === 1 ? 'צעד' : 'צעדים'}</b> יתרון —
        צעד לכל מי ששרד. יש לכם <b>2 דקות</b> לצבור עוד צעדים, ואז ${state.chaser.emoji}
        <b>${esc(state.chaser.title)}</b> מקבל 2 דקות להשיג אתכם.<br>
        אם הוא טועה — השעון נעצר ואתם יכולים לדחוף אותו צעד אחורה.
      </p>
      <div class="row justify-center">
        <button class="btn btn-gold btn-xl glow px-10" id="f-go">▶ מתחילים את המרדף הסופי</button>
      </div>
    </div>`;
  },
  mount(){
    mountTopBar();
    const skip = $('#f-skip');
    if (skip){ skip.addEventListener('click', () => go('results', { outcome:'none' })); return; }
    const start = () => {
      const s = survivors();
      state.final = { teamSteps: s.length, headStart: s.length, chaserSteps: 0, right: 0, wrong: 0, passed: 0 };
      const el = overlay('<div class="big logo">3</div>');
      countdown(el.firstElementChild, () => go('finalTeam'));
    };
    $('#f-go').addEventListener('click', start);
    onKeys({ Enter: start, ' ': start });
  }
};

/* ---------- 3א: שתי דקות של המשפחה ---------- */
Screens.finalTeam = {
  html(){
    const f = state.final;
    return `
    ${topBar('המרדף הסופי — התור שלכם', survivors().map(p => p.name).join(' · '))}
    <div class="grid gap-3">
      <div class="panel panel-pad grid gap-3">
        <div class="spread">
          <div>
            <div class="eyebrow">צעדים</div>
            <div class="logo text-5xl num" id="steps">${f.teamSteps}</div>
            <div class="muted text-sm">יתרון פתיחה: ${f.headStart}</div>
          </div>
          <div class="text-left">
            <div class="eyebrow">הקופה</div>
            <div class="money text-2xl text-yellow-300">${money(state.teamBank)}</div>
            <div class="muted text-sm" id="tally">0 נכונות · 0 שגויות</div>
          </div>
        </div>
        <div class="spread">
          <b class="text-3xl num" id="clock">2:00</b>
          <div class="bar flex-1" id="barwrap"><i id="bar" style="width:100%"></i></div>
        </div>
      </div>

      <div class="panel panel-pad qbox grid content-center gap-3" id="qcard" aria-live="polite">
        <div class="row"><span class="chip" id="qcat">—</span></div>
        <div class="qtext" id="q">…</div>
        ${Judge.html()}
      </div>

      <div class="grid gap-2 sm:grid-cols-3">
        <button class="btn btn-ok btn-xl" id="b-ok">✔ נכון <span class="kbd">←</span></button>
        <button class="btn btn-bad btn-xl" id="b-no">✘ לא נכון <span class="kbd">→</span></button>
        <button class="btn btn-xl" id="b-pass">↷ דלג <span class="kbd">רווח</span></button>
      </div>
    </div>`;
  },
  mount(){
    mountTopBar();
    const f = state.final;
    let q = null, locked = false, asked = 0;
    const passQueue = [];

    const draw = () => {
      asked++;
      q = (passQueue.length && asked % 4 === 0) ? passQueue.shift() : nextQuestion();
      $('#qcat').textContent = CATS[q.cat].icon + ' ' + CATS[q.cat].name;
      $('#q').textContent = q.q;
      Judge.set(q.a);
      locked = false;
    };
    const judge = kind => {
      if (locked || !clock.running) return;
      locked = true;
      const card = $('#qcard');
      if (kind === 'ok'){
        f.right++; f.teamSteps++; $('#steps').textContent = f.teamSteps;
        $('#steps').classList.remove('pop'); void $('#steps').offsetWidth; $('#steps').classList.add('pop');
        Sound.correct(); card.classList.add('flash-ok');
        Judge.reveal('ok');
      } else if (kind === 'no'){
        f.wrong++; Sound.wrong(); card.classList.add('flash-bad');
        Judge.reveal('no');
      } else { f.passed++; passQueue.push(q); Sound.pass(); }
      $('#tally').textContent = `${f.right} נכונות · ${f.wrong} שגויות`;
      addTimeout(() => {
        card.classList.remove('flash-ok', 'flash-bad');
        if (clock.running) draw();
      }, T(kind === 'no' ? 700 : 320));
    };

    const clock = new Clock(FINAL_SECONDS * 1000, {
      onTick: left => { $('#bar').style.width = (left / (FINAL_SECONDS * 1000) * 100) + '%'; },
      onSecond: s => {
        $('#clock').textContent = mmss(s * 1000);
        if (s <= 10){ $('#barwrap').classList.add('urgent'); Sound.tick(true); }
        else if (s <= 30) Sound.tick(false);
      },
      onEnd: () => {
        Sound.musicStop(); Sound.timeUp();
        ['#b-ok', '#b-no', '#b-pass'].forEach(s => { $(s).disabled = true; });
        overlay(`
          <div class="eyebrow mb-2">סיימתם עם</div>
          <div class="big logo">${f.teamSteps}</div>
          <div class="text-2xl font-black mt-2">צעדים</div>
          <div class="muted mt-3">עכשיו תורו של ${esc(state.chaser.title)} ${state.chaser.emoji}</div>`);
        addTimeout(() => go('finalChaser'), T(2800));
      }
    });

    $('#b-ok').addEventListener('click', () => judge('ok'));
    $('#b-no').addEventListener('click', () => judge('no'));
    $('#b-pass').addEventListener('click', () => judge('pass'));
    Judge.mount();
    onKeys({
      ArrowUp: () => Judge.reveal(),
      ArrowLeft: () => judge('ok'), ArrowRight: () => judge('no'), ' ': () => judge('pass'),
      '1': () => judge('ok'), '2': () => judge('no'), '3': () => judge('pass')
    });

    Sound.musicStart(1.4);
    addCleanup(() => Sound.musicStop());
    draw(); clock.start();
  }
};

/* ---------- 3ב: שתי הדקות של הצ׳ייסר ---------- */
Screens.finalChaser = {
  html(){
    const f = state.final;
    const h = clamp(Math.round(420 / Math.max(1, f.teamSteps)), 13, 26);
    let rungs = '';
    for (let i = 1; i <= f.teamSteps; i++){
      rungs += `<div class="step team" data-rung="${i}" style="height:${h}px">
                  <span class="num">${i}</span><span data-mark="${i}"></span></div>`;
    }
    const hostPanel = state.hostMode === 'human' ? `
      <div class="grid gap-2 sm:grid-cols-2" id="hostbtns">
        <button class="btn btn-ok btn-lg" id="c-ok">✔ הצ׳ייסר צדק</button>
        <button class="btn btn-bad btn-lg" id="c-no">✘ הצ׳ייסר טעה</button>
      </div>` : `
      <div class="bar" id="thinkwrap"><i id="think" style="width:0%"></i></div>`;

    return `
    ${topBar('המרדף הסופי — תור הצ׳ייסר', state.chaser.title)}
    <div class="grid gap-3 split split-narrow">
      <div class="panel panel-pad">
        <div class="spread mb-2">
          <span class="chip chip-player">היעד: <b class="num">${f.teamSteps}</b></span>
          <span class="chip chip-chaser">צ׳ייסר: <b class="num" id="csteps">0</b></span>
        </div>
        <div class="ladder" id="ladder">${rungs}</div>
        <div class="muted text-xs mt-2 text-center">הצ׳ייסר מטפס מלמטה למעלה</div>
      </div>

      <div class="grid gap-3 content-start">
        <div class="panel panel-pad spread">
          <b class="text-3xl num" id="clock">2:00</b>
          <div class="bar flex-1" id="barwrap"><i id="bar" style="width:100%"></i></div>
        </div>
        <div class="panel panel-pad qbox grid content-center gap-3" id="qcard" aria-live="polite">
          <div class="row">
            <span class="chip" id="qcat">—</span>
            <span class="chip chip-chaser" id="status">${state.chaser.emoji} חושב…</span>
          </div>
          <div class="qtext" id="q">…</div>
          ${Judge.html()}
        </div>
        ${hostPanel}
      </div>
    </div>
    <div id="pb"></div>`;
  },

  mount(){
    mountTopBar();
    const f = state.final;
    let q = null, busy = false, over = false;

    const paintLadder = () => {
      $('#csteps').textContent = f.chaserSteps;
      $$('[data-rung]').forEach(r => {
        const i = +r.dataset.rung;
        r.classList.toggle('caught', i <= f.chaserSteps);
        r.querySelector('[data-mark]').textContent = i === f.chaserSteps ? '😈' : '';
      });
    };
    paintLadder();

    const clock = new Clock(FINAL_SECONDS * 1000, {
      onTick: left => { $('#bar').style.width = (left / (FINAL_SECONDS * 1000) * 100) + '%'; },
      onSecond: s => {
        $('#clock').textContent = mmss(s * 1000);
        if (s <= 10){ $('#barwrap').classList.add('urgent'); Sound.tick(true); }
        else if (s <= 30) Sound.tick(false);
      },
      onEnd: () => end('team')
    });

    function end(who){
      if (over) return;
      over = true;
      clock.stop(); Sound.musicStop();
      addTimeout(() => go('results', { outcome: who }), T(2400));
      if (who === 'team'){
        Sound.win();
        overlay(`<div class="eyebrow mb-2">נגמר הזמן — ברחתם!</div>
                 <div class="big logo">${money(state.teamBank)}</div>
                 <div class="muted mt-3">הצ׳ייסר עצר על ${f.chaserSteps} מתוך ${f.teamSteps}</div>`);
      } else {
        Sound.caught();
        overlay(`<div class="eyebrow mb-2">הצ׳ייסר השיג אתכם</div>
                 <div class="big">😈</div>
                 <div class="text-2xl font-black mt-2">הקופה נשארת אצלו</div>`);
      }
    }

    const ask = () => {
      if (over) return;
      busy = false;
      q = nextQuestion();
      $('#qcat').textContent = CATS[q.cat].icon + ' ' + CATS[q.cat].name;
      $('#q').textContent = q.q;
      $('#status').textContent = state.chaser.emoji + ' חושב…';
      $('#status').className = 'chip chip-chaser';
      /* מנחה אנושי מסמן אם הצ׳ייסר צדק — ולשם כך הוא חייב לראות את התשובה.
         כשהמחשב עונה אין מה לשפוט, ולכן התשובה נשארת מוסתרת עד הגילוי. */
      Judge.set(q.a);
      if (state.hostMode === 'ai') Judge.hide();

      if (state.hostMode === 'ai'){
        const think = T(state.chaser.pace * 1000 * rnd(.7, 1.3));
        const bar = $('#think');
        const c = new Clock(think, {
          onTick: left => { bar.style.width = ((1 - left / think) * 100) + '%'; },
          onEnd: () => verdict(chaserKnows(q))
        }).start();
        addCleanup(() => c.stop());
        state.final.thinkClock = c;
      } else {
        ['#c-ok', '#c-no'].forEach(s => { const b = $(s); if (b) b.disabled = false; });
      }
    };

    function verdict(ok){
      if (busy || over) return;
      busy = true;
      ['#c-ok', '#c-no'].forEach(s => { const b = $(s); if (b) b.disabled = true; });
      Judge.reveal(ok ? 'ok' : 'no');

      if (ok){
        f.chaserSteps++;
        $('#status').textContent = '✔ הצ׳ייסר צדק';
        Sound.stepChaser(); paintLadder();
        if (f.chaserSteps >= f.teamSteps) return end('chaser');
        addTimeout(ask, T(850));
      } else {
        $('#status').textContent = '✘ הצ׳ייסר טעה — הזדמנות לדחיפה!';
        $('#status').className = 'chip chip-player';
        Sound.wrong();
        addTimeout(pushback, T(550));
      }
    }

    /* ---------- דחיפה לאחור ---------- */
    function pushback(){
      if (over) return;
      clock.pause();
      Sound.pushback();
      const letters = LETTERS;
      $('#pb').innerHTML = `
        <div class="overlay">
          <div class="panel panel-pad rise" style="max-width:680px;width:100%">
            <div class="spread mb-2">
              <b class="text-xl">🔁 דחיפה לאחור!</b>
              <span class="chip chip-gold">נותרו <b class="num" id="pb-n">${PUSHBACK_SECONDS}</b> שניות</span>
            </div>
            <p class="muted text-sm mb-2">הצ׳ייסר טעה. ענו נכון ותדחפו אותו צעד אחד אחורה.</p>
            <div class="qtext mb-3">${esc(q.q)}</div>
            <div class="grid gap-2" id="pb-opts">
              ${q.shuffled.map((o, i) => `
                <button class="opt" data-pb="${i}"><span class="badge">${letters[i]}</span><span>${esc(o)}</span></button>`).join('')}
            </div>
          </div>
        </div>`;

      let answered = false;
      const done = ok => {
        if (answered) return;
        answered = true;
        pbClock.stop();
        const correct = q.shuffled.indexOf(q.a);
        $$('#pb-opts .opt').forEach((b, i) => b.classList.add(i === correct ? 'right' : 'wrongpick'));
        if (ok && f.chaserSteps > 0){
          f.chaserSteps--; paintLadder(); Sound.pushback();
        } else if (ok){ Sound.correct(); }
        else Sound.wrong();
        addTimeout(() => {
          $('#pb').innerHTML = '';
          if (over) return;
          clock.resume();
          ask();
        }, T(1100));
      };

      const pbClock = new Clock(PUSHBACK_SECONDS * 1000, {
        onSecond: s => { const el = $('#pb-n'); if (el) el.textContent = Math.max(0, s); if (s <= 3) Sound.tick(true); },
        onEnd: () => done(false)
      }).start();

      bind('[data-pb]', 'click', e => {
        $$('#pb-opts .opt').forEach(b => b.disabled = true);
        done(+e.currentTarget.dataset.pb === q.shuffled.indexOf(q.a));
      });
    }

    Judge.mount();
    if (state.hostMode === 'human'){
      $('#c-ok').addEventListener('click', () => verdict(true));
      $('#c-no').addEventListener('click', () => verdict(false));
    }

    Sound.musicStart(2);
    addCleanup(() => Sound.musicStop());
    clock.start();
    ask();
  }
};

/* ============================================================
   מסך אחרון — תוצאות
   ============================================================ */
Screens.results = {
  html(data){
    const outcome = (data && data.outcome) || 'none';
    const won = outcome === 'team';
    const total = won ? state.teamBank : 0;
    const f = state.final || { teamSteps: 0, chaserSteps: 0 };
    const head = won
      ? { t:'ניצחתם את הצ׳ייסר!', s:'🏆', c:'text-yellow-300' }
      : outcome === 'chaser'
        ? { t:'הצ׳ייסר תפס אתכם', s:'😈', c:'text-red-300' }
        : { t:'הצ׳ייסר ניצח את כולם', s:'😈', c:'text-red-300' };

    const rows = state.players.map(p => {
      const safe = p.status === 'safe';
      return `
      <div class="panel panel-sm spread">
        <div class="row">
          <span class="chip ${safe ? 'chip-gold' : 'chip-chaser'}">${safe ? 'הגיע/ה הביתה' : 'נתפס/ה'}</span>
          <b>${esc(p.name)}</b>
        </div>
        <div class="text-left">
          <div class="money ${safe && won ? 'text-yellow-300' : 'muted'}">${money(safe ? p.won : 0)}</div>
          <div class="muted text-xs">
            ${safe ? 'הכניס/ה לקופה המשותפת' : 'לא הגיע/ה הביתה'} · צבר/ה ${money(p.bank)} בסבב הראשון
          </div>
        </div>
      </div>`;
    }).join('');

    return `
    ${topBar('סוף המשחק', 'תוצאות')}
    <div class="panel panel-pad text-center grid gap-3 py-8 mb-3">
      <div class="big">${head.s}</div>
      <h2 class="logo text-4xl sm:text-5xl">${head.t}</h2>
      <div class="eyebrow mt-2">סך הזכייה</div>
      <div class="logo text-6xl ${head.c}">${money(total)}</div>
      ${outcome !== 'none' ? `<div class="muted">במרדף הסופי: ${f.teamSteps} צעדים לקבוצה · ${f.chaserSteps} לצ׳ייסר</div>` : ''}
      ${won && total > 0 && state.players.filter(p => p.status === 'safe').length > 1
        ? `<div class="muted">${money(Math.round(total / state.players.filter(p => p.status === 'safe').length))} לכל שחקן ששרד</div>` : ''}
    </div>
    <div class="grid gap-2 mb-4">${rows}</div>
    <div class="row justify-center">
      <button class="btn btn-gold btn-xl" id="again">🔁 משחק נוסף</button>
      <button class="btn btn-lg" id="menu">לתפריט הראשי</button>
    </div>`;
  },
  mount(data){
    mountTopBar();
    $('#btn-quit').classList.add('hidden');
    if (data && data.outcome === 'team') Sound.win();
    $('#again').addEventListener('click', () => {
      state.players.forEach(p => { p.bank = 0; p.status = 'pending'; p.won = 0; p.offer = null; });
      state.current = 0; state.teamBank = 0; buildPool();
      go('ready');
    });
    $('#menu').addEventListener('click', () => go('menu'));
  }
};

/* ============================================================
   הפעלה
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  go('menu');
  /* פתיחת הקול מחייבת מחוות משתמש — נתפוס את הראשונה שתגיע */
  const unlock = () => { Sound.init(); Sound.resume(); };
  window.addEventListener('pointerdown', unlock, { once: true });
  window.addEventListener('keydown', unlock, { once: true });
});

/* וו לבדיקות אוטומטיות */
window.__chase = { state, go, Screens, Sound, CHASERS, RAW, CATS, buildPool, makeOffers };
</script>
