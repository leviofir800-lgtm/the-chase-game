<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060e">
<meta name="description" content="הצ'ייסר — משחק טריוויה משפחתי בהשראת התוכנית, ל-1 עד 4 שחקנים.">
<title>הצ'ייסר — משחק טריוויה משפחתי</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<!-- Tailwind נטען אסינכרונית ומשמש להרחבות עתידיות. כל מה שהמשחק צריך כתוב
     ב-<style> שלמטה, ולכן המשחק נראה ומתנהג אותו דבר גם בלי אינטרנט. -->
<script async src="https://cdn.tailwindcss.com"
        onload="if(window.tailwind){tailwind.config={theme:{extend:{colors:{gold:'#f5c518',goldsoft:'#ffe27a',player:'#38bdf8',chaser:'#ef4444',ink:'#e9eefb',muted:'#93a4c8'},fontFamily:{sans:['Heebo','Rubik','Segoe UI','Arial','sans-serif']}}}};}"></script>

<style>
/* ============================================================
   הצ'ייסר — studio theme
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:#04060e; --panel-1:rgba(19,28,54,.92); --panel-2:rgba(10,16,32,.92);
  --gold:#f5c518; --gold-2:#ffe27a; --player:#38bdf8; --chaser:#ef4444;
  --ink:#e9eefb; --muted:#93a4c8; --ok:#22c55e; --bad:#ef4444;
  --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Heebo','Rubik','Segoe UI',system-ui,Arial,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
#bgfx{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1100px 640px at 50% -12%, rgba(245,197,24,.16), transparent 62%),
    radial-gradient(820px 560px at 8% 112%, rgba(56,189,248,.12), transparent 62%),
    radial-gradient(820px 560px at 92% 112%, rgba(239,68,68,.12), transparent 62%),
    linear-gradient(180deg,#0a1020 0%, #04060e 58%);
}
#bgfx::after{
  content:''; position:absolute; inset:0; opacity:.45;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
}
.wrap{max-width:1120px; margin:0 auto; padding:16px}
@media (min-width:768px){ .wrap{padding:24px} }

/* ---------- typography ---------- */
.logo{
  font-weight:900; letter-spacing:-.03em; line-height:.95;
  background:linear-gradient(180deg,#fffbe8 0%,#ffe27a 40%,#f5c518 62%,#c08a06 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 6px 26px rgba(245,197,24,.35));
}
.eyebrow{letter-spacing:.28em; font-weight:800; color:var(--muted); font-size:.72rem}
.muted{color:var(--muted)}
.qtext{font-size:clamp(1.25rem,3.4vw,2.1rem); font-weight:800; line-height:1.3}
.money{font-variant-numeric:tabular-nums; font-weight:900}
.num{font-variant-numeric:tabular-nums}

/* ---------- surfaces ---------- */
.panel{
  background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
  border:1px solid var(--line); border-radius:22px;
  box-shadow:0 32px 70px -34px #000, inset 0 1px 0 rgba(255,255,255,.05);
}
.panel-pad{padding:clamp(14px,3vw,26px)}
.chip{
  display:inline-flex; align-items:center; gap:.35rem;
  padding:.22rem .6rem; border-radius:999px; font-size:.78rem; font-weight:800;
  border:1px solid var(--line); background:rgba(255,255,255,.06);
}
.chip-player{border-color:rgba(56,189,248,.55); background:rgba(56,189,248,.16); color:#bae6fd}
.chip-chaser{border-color:rgba(239,68,68,.55); background:rgba(239,68,68,.16); color:#fecaca}
.chip-gold{border-color:rgba(245,197,24,.55); background:rgba(245,197,24,.16); color:#ffe9a8}

/* ---------- buttons ---------- */
.btn{
  appearance:none; font:inherit; font-weight:800; color:inherit; cursor:pointer;
  min-height:48px; padding:.7rem 1.15rem; border-radius:16px;
  border:1px solid var(--line); background:rgba(255,255,255,.07);
  transition:transform .12s ease, background .18s ease, box-shadow .18s ease, opacity .18s;
}
.btn:hover:not(:disabled){background:rgba(255,255,255,.13); transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn-gold{background:linear-gradient(180deg,#ffe694,#f5c518); color:#231a00; border-color:#ffdf6b;
  box-shadow:0 16px 34px -16px rgba(245,197,24,.8)}
.btn-gold:hover:not(:disabled){background:linear-gradient(180deg,#fff0b8,#ffd23a)}
.btn-ok{background:linear-gradient(180deg,#4ade80,#16a34a); color:#03220f; border-color:#6ee7a0}
.btn-ok:hover:not(:disabled){background:linear-gradient(180deg,#6ee7a0,#22c55e)}
.btn-bad{background:linear-gradient(180deg,#fb7185,#dc2626); color:#2a0406; border-color:#fca5a5}
.btn-bad:hover:not(:disabled){background:linear-gradient(180deg,#fda4af,#ef4444)}
.btn-lg{min-height:60px; font-size:1.12rem; padding:.9rem 1.5rem; border-radius:18px}
.btn-xl{min-height:72px; font-size:1.3rem; border-radius:20px}
.btn-ghost{background:transparent}
.kbd{font-size:.7rem; opacity:.65; font-weight:700}

/* ---------- inputs ---------- */
.field{
  width:100%; min-height:48px; font:inherit; font-weight:700; color:var(--ink);
  background:rgba(255,255,255,.06); border:1px solid var(--line);
  border-radius:14px; padding:.6rem .9rem;
}
.field::placeholder{color:#6f80a4; font-weight:600}
.field:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,197,24,.22)}
label.pick{
  display:flex; gap:.6rem; align-items:center; cursor:pointer; user-select:none;
  padding:.6rem .8rem; border-radius:14px; border:1px solid var(--line);
  background:rgba(255,255,255,.05); font-weight:700; min-height:48px;
}
label.pick:hover{background:rgba(255,255,255,.1)}
label.pick input{accent-color:var(--gold); width:20px; height:20px}
label.pick.on{border-color:var(--gold); background:rgba(245,197,24,.14)}

/* difficulty / mode cards */
.card-pick{
  text-align:right; width:100%; cursor:pointer; border-radius:18px; padding:1rem;
  border:1px solid var(--line); background:rgba(255,255,255,.05); transition:.18s;
}
.card-pick:hover{background:rgba(255,255,255,.1); transform:translateY(-2px)}
.card-pick.on{border-color:var(--gold); background:rgba(245,197,24,.13); box-shadow:0 0 0 3px rgba(245,197,24,.2)}
.card-pick:focus-visible{outline:3px solid var(--gold); outline-offset:3px}

/* ---------- timer ring ---------- */
.ring{
  --p:100; --ringc:var(--gold);
  width:clamp(96px,22vw,132px); aspect-ratio:1; border-radius:50%;
  background:conic-gradient(var(--ringc) calc(var(--p) * 1%), rgba(255,255,255,.07) 0);
  display:grid; place-items:center; position:relative; flex:0 0 auto;
  transition:background .2s linear;
}
.ring::after{content:''; position:absolute; inset:9px; border-radius:50%; background:#070c18; border:1px solid rgba(255,255,255,.06)}
.ring b{position:relative; z-index:1; font-size:clamp(1.6rem,5vw,2.2rem); font-weight:900; font-variant-numeric:tabular-nums}
.ring.urgent{--ringc:var(--bad); animation:pulse .6s infinite}
.bar{height:14px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid var(--line)}
.bar > i{display:block; height:100%; background:linear-gradient(90deg,#ffe27a,#f5c518); transition:width .2s linear}
.bar.urgent > i{background:linear-gradient(90deg,#fca5a5,#ef4444)}

/* ---------- answer options ---------- */
.opt{
  display:flex; gap:.75rem; align-items:center; width:100%; text-align:right;
  font-size:clamp(1rem,2.5vw,1.3rem); font-weight:800; padding:.85rem 1rem;
  border-radius:16px; border:2px solid var(--line); background:rgba(255,255,255,.05);
  cursor:pointer; min-height:64px; transition:.16s; position:relative;
}
.opt:hover:not(:disabled){background:rgba(255,255,255,.11)}
.opt:disabled{cursor:default}
.opt:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.opt .badge{
  width:2.3rem; height:2.3rem; border-radius:12px; display:grid; place-items:center;
  background:rgba(255,255,255,.12); font-weight:900; flex:0 0 auto;
}
.opt .who{margin-inline-start:auto; display:flex; gap:.3rem; flex:0 0 auto}
.opt.pick-p{border-color:var(--player); background:rgba(56,189,248,.16)}
.opt.pick-c{border-color:var(--chaser); background:rgba(239,68,68,.16)}
.opt.pick-p.pick-c{border-color:#a78bfa; background:rgba(167,139,250,.18)}
.opt.right{border-color:var(--ok)!important; background:rgba(34,197,94,.24)!important}
.opt.wrongpick{border-color:var(--bad)!important; background:rgba(239,68,68,.2)!important}

/* ---------- כרטיס המנחה ---------- */
.judgecard{
  border-top:1px dashed rgba(255,255,255,.16); padding-top:.7rem; margin-top:.2rem;
  display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; min-height:46px;
}
.judgetext{font-size:clamp(1rem,2.4vw,1.35rem); font-weight:900; color:var(--gold-2)}

/* ---------- chase board ---------- */
.board{display:flex; flex-direction:column; gap:6px; height:clamp(280px,44vh,520px)}
@media (min-width:1024px){ .board{height:clamp(380px,62vh,560px)} }
.slot{
  flex:1 1 0; min-height:0; border-radius:14px; border:1px solid var(--line);
  background:linear-gradient(90deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 8px;
  font-size:.78rem; font-weight:800; color:#7f90b4; position:relative;
}
.slot .lane{display:flex; align-items:center; min-width:0}
.slot .lane-c{justify-content:flex-start}
.slot .lane-p{justify-content:flex-end}
.slot.home{background:linear-gradient(90deg,rgba(245,197,24,.3),rgba(245,197,24,.07)); border-color:rgba(245,197,24,.6); color:#ffe9a8}
.slot.chaserrow{background:linear-gradient(90deg,rgba(239,68,68,.28),rgba(239,68,68,.06)); border-color:rgba(239,68,68,.55); color:#fecaca}
.slot.hot{box-shadow:0 0 0 2px rgba(245,197,24,.5) inset}
.tok{
  display:grid; place-items:center; border-radius:12px; font-weight:900;
  padding:.2rem .55rem; font-size:clamp(.72rem,2.2vw,.9rem); white-space:nowrap;
  max-width:100%; overflow:hidden; text-overflow:ellipsis;
}
.tok-p{background:linear-gradient(180deg,#7dd3fc,#0ea5e9); color:#04222f; box-shadow:0 10px 24px -12px rgba(56,189,248,.9)}
.tok-c{background:linear-gradient(180deg,#fca5a5,#dc2626); color:#2a0406; box-shadow:0 10px 24px -12px rgba(239,68,68,.9)}
.tok-short,.lbl-short{display:none}
/* בטלפון הלוח נפרש לרוחב, כדי שהשאלה והתשובות יישארו על המסך */
@media (max-width:767px){
  .board{flex-direction:row; height:auto; gap:4px; align-items:stretch}
  .slot{flex:1 1 0; min-width:0; grid-template-columns:1fr; grid-template-rows:auto 1fr auto;
        justify-items:center; text-align:center; padding:6px 2px; min-height:96px; font-size:.64rem}
  .slot .lane{width:100%; justify-content:center; align-items:center; min-height:26px}
  .tok{width:100%; padding:.2rem .1rem; font-size:.8rem}
  .tok-full,.lbl-full{display:none}
  .tok-short,.lbl-short{display:inline}
}

/* ---------- final chase ladder ---------- */
.ladder{display:flex; flex-direction:column-reverse; gap:5px}
.step{height:26px; border-radius:9px; border:1px solid var(--line); background:rgba(255,255,255,.05);
  display:flex; align-items:center; justify-content:space-between; padding:0 .5rem; font-size:.72rem; font-weight:800; color:#7f90b4}
.step.team{background:linear-gradient(90deg,rgba(56,189,248,.26),rgba(56,189,248,.05)); border-color:rgba(56,189,248,.5); color:#bae6fd}
.step.homestep{background:linear-gradient(90deg,rgba(245,197,24,.28),rgba(245,197,24,.05)); border-color:rgba(245,197,24,.5); color:#ffe9a8}
.step.caught{background:linear-gradient(90deg,rgba(239,68,68,.32),rgba(239,68,68,.07)); border-color:rgba(239,68,68,.6); color:#fecaca}

/* ---------- overlays & motion ---------- */
.overlay{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px;
  background:rgba(3,6,14,.82); backdrop-filter:blur(7px); animation:fade .2s ease}
.big{font-size:clamp(2.4rem,12vw,6rem); font-weight:900; line-height:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes pop{0%{transform:scale(.75);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,197,24,.55)}50%{box-shadow:0 0 40px 6px rgba(245,197,24,.35)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .32s cubic-bezier(.2,.9,.25,1.3)}
.shake{animation:shake .45s}
.glow{animation:glow 1.8s infinite}
.rise{animation:rise .3s ease both}
.flash-ok{animation:flashok .5s}
.flash-bad{animation:flashbad .5s}
@keyframes flashok{0%,100%{background-color:transparent}35%{background-color:rgba(34,197,94,.22)}}
@keyframes flashbad{0%,100%{background-color:transparent}35%{background-color:rgba(239,68,68,.22)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important}
}

/* ---------- misc ---------- */
.hidden{display:none!important}
.scroll{max-height:min(46vh,420px); overflow-y:auto; padding-inline-end:4px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16); border-radius:99px}
.grid-2{display:grid; gap:12px; grid-template-columns:1fr}
@media (min-width:640px){ .grid-2{grid-template-columns:1fr 1fr} }
.grid-3{display:grid; gap:12px; grid-template-columns:1fr}
@media (min-width:768px){ .grid-3{grid-template-columns:repeat(3,1fr)} }
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{min-height:92vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-block:2rem}
.panel-sm{padding:12px; border-radius:16px; background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
  border:1px solid var(--line); box-shadow:0 20px 50px -30px #000}
.btn-icon{min-height:40px; padding:.4rem .7rem}
.qbox{min-height:180px}
.split{display:grid; gap:12px}
@media (min-width:1024px){
  .split{grid-template-columns:300px minmax(0,1fr)}
  .split-narrow{grid-template-columns:260px minmax(0,1fr)}
}

/* ------------------------------------------------------------
   שכבת עזר עצמאית.
   Tailwind נטען מה-CDN ומשמש לפריסה, אבל כל מה שהמשחק באמת צריך

   לאלה של Tailwind, ולכן אין התנגשות כששניהם נטענים.
   ------------------------------------------------------------ */

.flex-col{flex-direction:column} .flex-1{flex:1 1 0%} .min-w-0{min-width:0} .w-full{width:100%}

.mt-1{margin-top:.25rem} .mt-2{margin-top:.5rem} .mt-3{margin-top:.75rem} .mt-4{margin-top:1rem} .mt-10{margin-top:2.5rem}
.my-1{margin-block:.25rem}
.py-8{padding-block:2rem} .py-10{padding-block:2.5rem} .py-12{padding-block:3rem} .px-10{padding-inline:2.5rem}
.max-w-sm{max-width:24rem} .max-w-md{max-width:28rem} .max-w-lg{max-width:32rem} .max-w-xl{max-width:36rem}
.text-center{text-align:center} .text-left{text-align:left}
.font-bold{font-weight:700} .font-black{font-weight:900}

  .sm\:block{display:block}

<body>
<div id="bgfx"></div>
<main id="app" class="wrap"></main>
<div id="overlay-root"></div>
<script>
/* ============================================================
   מאגר השאלות
   כל שורה: [שאלה, תשובה נכונה, מסיח, מסיח]
   התשובה הנכונה תמיד ראשונה כאן — הסדר מעורבב בזמן ההצגה.
   ============================================================ */
const CATS = {
  gk:   { name:'ידע כללי',        icon:'🌍' },
  il:   { name:'תרבות ישראלית',   icon:'🇮🇱' },
  tv:   { name:'קולנוע וטלוויזיה', icon:'🎬' },
  sci:  { name:'מדע וטבע',        icon:'🔬' },
  hist: { name:'היסטוריה',        icon:'📜' },
  kids: { name:'ילדים ודיסני',    icon:'🧸' },
  fam:  { name:'טריוויה משפחתית', icon:'👨‍👩‍👧‍👦' }
};

const RAW = {
gk: [
["מהי בירת אוסטרליה?","קנברה","סידני","מלבורן"],
["כמה שחקנים מכל קבוצה נמצאים על מגרש הכדורסל?","5","6","7"],
["מהו האוקיינוס הגדול בעולם?","האוקיינוס השקט","האוקיינוס האטלנטי","האוקיינוס ההודי"],
["מהי היבשת הגדולה בעולם?","אסיה","אפריקה","צפון אמריקה"],
["כמה צבעים יש בקשת?","7","5","9"],

["איך נקראות הדמויות הצהובות הקטנות מסרטי 'גרו'?","מיניונים","טרולים","סמורפים"],
["מאיזה גזע הם הכלבים בסרט '101 הכלבים'?","דלמטי","פודל","בולדוג"],
["מה שם הילדה עם הסבתא בכפר האלפים בסדרת הילדים הקלאסית?","היידי","פולי","אנני"],
["באיזה סרט של דיסני מופיע שטיח מעופף?","אלאדין","הרקולס","טרזן"]

</script>
<script>
/* ============================================================
   כלי עזר כלליים
   ============================================================ */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const APP = () => document.getElementById('app');
const OVR = () => document.getElementById('overlay-root');

const fmt   = n => Number(n).toLocaleString('he-IL');
const money = n => fmt(n) + ' ₪';
const rnd   = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc   = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => addTimeout(r, typeof T === 'function' ? T(ms) : ms));

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function mmss(ms){
  const t = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(t / 60)) + ':' + String(t % 60).padStart(2, '0');
}
/* FLIP animation — used when a token hops to another rung on the board */
function flipMove(el, mutate){
  const before = el.getBoundingClientRect();
  mutate();
  const after = el.getBoundingClientRect();
  const dx = before.left - after.left, dy = before.top - after.top;
  if (!dx && !dy) return;
  if (el.animate) el.animate(
    [{ transform:`translate(${dx}px, ${dy}px)` }, { transform:'none' }],
    { duration: 520, easing:'cubic-bezier(.2,.9,.25,1.25)' }
  );
}

/* ---------- אחסון מקומי ---------- */
const KEY_CUSTOM   = 'chase.custom.v1';
const KEY_SETTINGS = 'chase.settings.v1';
const Store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ /* private mode */ } }
};

/* ============================================================
   מנוע קול — הכול מסונתז ב-Web Audio API, ללא קבצים חיצוניים
   ============================================================ */
const Sound = {
  ctx:null, master:null, muted: !!Store.get(KEY_SETTINGS, {}).muted,
  _music:null,

  init(){
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.55;
      this.master.connect(this.ctx.destination);
    } catch(e){ this.ctx = null; }
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m){
    this.muted = m;
    const s = Store.get(KEY_SETTINGS, {}); s.muted = m; Store.set(KEY_SETTINGS, s);
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.55, this.ctx.currentTime, 0.02);
  },

  /* צליל בסיסי */
  tone({ freq = 440, dur = .18, type = 'sine', gain = .22, delay = 0, glide = null, dest = null }){
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(20, glide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t0); o.stop(t0 + dur + .05);
  },
  noise({ dur = .2, gain = .2, freq = 1200, q = 1, delay = 0, type = 'lowpass' }){
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + .02);
  },

  /* אפקטים */
  tick(urgent){
    this.tone({ freq: urgent ? 1250 : 900, dur: .05, type:'square', gain: urgent ? .12 : .07 });
  },
  beep(){ this.tone({ freq: 760, dur: .1, type:'square', gain: .14 }); },
  correct(){
    [0, .09, .18].forEach((d, i) => this.tone({ freq: [660, 880, 1320][i], dur: .22, type:'triangle', gain: .2, delay: d }));
  },
  wrong(){
    this.tone({ freq: 200, dur: .38, type:'sawtooth', gain: .2, glide: 90 });
    this.tone({ freq: 150, dur: .38, type:'square', gain: .12, glide: 70, delay: .02 });
  },
  pass(){ this.tone({ freq: 420, dur: .1, type:'sine', gain: .12, glide: 300 }); },
  lock(){ this.tone({ freq: 300, dur: .16, type:'square', gain: .16, glide: 1000 }); this.noise({ dur:.16, gain:.1, freq:2600, type:'highpass' }); },
  stepPlayer(){ this.tone({ freq: 420, dur: .22, type:'triangle', gain: .2, glide: 700 }); },
  stepChaser(){ this.tone({ freq: 150, dur: .3, type:'sawtooth', gain: .22, glide: 70 }); this.noise({ dur:.22, gain:.18, freq:320 }); },
  pushback(){ [0,.08,.16].forEach((d,i)=>this.tone({ freq:[880,660,520][i], dur:.2, type:'triangle', gain:.2, delay:d })); },
  caught(){
    this.tone({ freq: 240, dur: 1.0, type:'sawtooth', gain: .26, glide: 60 });
    this.noise({ dur: .9, gain: .2, freq: 400 });
  },
  win(){
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
      this.tone({ freq: f, dur: .5, type:'triangle', gain: .22, delay: i * .13 }));
    [261.6, 329.6, 392, 523.25].forEach((f, i) =>
      this.tone({ freq: f, dur: .6, type:'sine', gain: .12, delay: i * .13 }));
  },
  offer(){ this.tone({ freq: 520, dur: .5, type:'sine', gain: .16, glide: 880 }); },
  timeUp(){
    this.tone({ freq: 440, dur: .35, type:'square', gain: .18 });
    this.tone({ freq: 330, dur: .55, type:'square', gain: .18, delay: .3 });
  },

  /* מוזיקת מתח — דרון נמוך + פעימה קצבית */
  musicStart(intensity = 1){
    if (!this.ctx || this.muted || this._music) return;
    const g = this.ctx.createGain();
    g.gain.value = .16;
    g.connect(this.master);
    const drone = [55, 82.4].map(f => {
      const o = this.ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
      const og = this.ctx.createGain(); og.gain.value = .35;
      o.connect(lp); lp.connect(og); og.connect(g); o.start();
      return o;
    });
    const beat = setInterval(() => {
      if (this.muted) return;
      this.tone({ freq: 110, dur: .12, type:'square', gain: .07, dest: g });
    }, Math.max(320, 620 / intensity));
    this._music = { g, drone, beat };
  },
  musicStop(){
    if (!this._music) return;
    const { g, drone, beat } = this._music;
    clearInterval(beat);
    try {
      g.gain.setTargetAtTime(0.0001, this.ctx.currentTime, .12);
      drone.forEach(o => o.stop(this.ctx.currentTime + .5));
    } catch(e){}
    this._music = null;
  }
};

/* ============================================================
   שעונים וטיימרים — כולם נרשמים כדי שאפשר יהיה לנקות בין מסכים
   ============================================================ */
const live = { timeouts: new Set(), intervals: new Set(), clocks: new Set(), cleanups: [] };

function addTimeout(fn, ms){
  const id = setTimeout(() => { live.timeouts.delete(id); fn(); }, ms);
  live.timeouts.add(id);
  return id;
}
function addInterval(fn, ms){
  const id = setInterval(fn, ms);
  live.intervals.add(id);
  return id;
}
function clearAllTimers(){
  live.timeouts.forEach(clearTimeout);  live.timeouts.clear();
  live.intervals.forEach(clearInterval); live.intervals.clear();
  live.clocks.forEach(c => c.stop());   live.clocks.clear();
  live.cleanups.forEach(fn => { try { fn(); } catch(e){} });
  live.cleanups = [];
}
function addCleanup(fn){ live.cleanups.push(fn); }

class Clock {
  constructor(ms, { onTick, onSecond, onEnd } = {}){
    this.total = ms; this.left = ms;
    this.onTick = onTick; this.onSecond = onSecond; this.onEnd = onEnd;
    this.raf = null; this.running = false; this.lastSec = null;
    live.clocks.add(this);
  }
  start(){
    if (this.running) return this;
    this.running = true;
    this.at = performance.now();
    const loop = now => {
      if (!this.running) return;
      const dt = now - this.at; this.at = now;
      this.left = Math.max(0, this.left - dt);
      if (this.onTick) this.onTick(this.left, this.total);
      const sec = Math.ceil(this.left / 1000);
      if (sec !== this.lastSec){ this.lastSec = sec; if (this.onSecond) this.onSecond(sec); }
      if (this.left <= 0){ this.running = false; if (this.onEnd) this.onEnd(); return; }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
    return this;
  }
  pause(){ this.running = false; if (this.raf) cancelAnimationFrame(this.raf); return this; }
  resume(){ if (!this.running && this.left > 0) this.start(); return this; }
  add(ms){ this.left = clamp(this.left + ms, 0, this.total); return this; }
  stop(){ this.pause(); live.clocks.delete(this); }
}

/* ============================================================
   מצב המשחק
   ============================================================ */
const CHASERS = {
  easy:   { key:'easy',   name:'קל',      title:'הצ׳ייסר המתלמד', accuracy:.60, pace:5.0, mult:4, emoji:'🙂',
            blurb:'טועה לא מעט. מושלם למשחק ראשון עם הילדים.' },
  medium: { key:'medium', name:'בינוני',  title:'הצ׳ייסר המקצוען', accuracy:.75, pace:4.0, mult:6, emoji:'😎',
            blurb:'מהיר ומדויק. צריך לשחק טוב כדי לברוח.' },
  hard:   { key:'hard',   name:'קשה',     title:'מצב איתי הרמן',   accuracy:.90, pace:3.2, mult:8, emoji:'🔥',
            blurb:'כמעט לא טועה ועונה מהר. בהצלחה, תצטרכו אותה.' }
};
/* חוזקות וחולשות לכל רמה — מוסיף אופי לצ׳ייסר */
const CHASER_BIAS = {
  easy:   { kids:+.12, gk:+.04, sci:-.08, hist:-.06, il:0,     tv:+.02, fam:-.30 },
  medium: { kids:+.04, gk:+.03, sci:+.02, hist:+.02, il:+.03,  tv:+.02, fam:-.35 },
  hard:   { kids:-.02, gk:+.02, sci:+.04, hist:+.05, il:+.03,  tv:+.02, fam:-.40 }
};

const BOARD_STEPS = 7;               // 7 שלבים בין הצ׳ייסר לבית
const HOME = BOARD_STEPS;            // מיקום 7 = בית
const START_POS = { high: 2, mid: 3, low: 4 };
let CASH_SECONDS  = 60;
let FINAL_SECONDS = 120;
let PUSHBACK_SECONDS = 7;
let LOCK_SECONDS = 5;

/* מצב מהיר לבדיקות: index.html?fast=1 מקצר את כל הטיימרים וההשהיות הדרמטיות */
let FAST = false;
const T = ms => FAST ? Math.max(50, ms * 0.12) : ms;
try {
  if (new URLSearchParams(location.search).get('fast')){
    FAST = true;
    CASH_SECONDS = 8; FINAL_SECONDS = 10; PUSHBACK_SECONDS = 3; LOCK_SECONDS = 2;
  }
} catch(e){}

const state = {
  screen: 'menu',
  players: [],
  current: 0,
  chaser: CHASERS.medium,
  hostMode: 'ai',            // 'ai' | 'human'
  answerMode: 'host',        // 'host' = התשובה גלויה למנחה | 'shared' = מוסתרת עד לחיצה
  cats: Object.keys(CATS).filter(k => k !== 'fam'),
  useFamily: true,
  pool: [], used: new Set(),
  cash: null, chase: null, final: null,
  teamBank: 0
};

/* ---------- מאגר שאלות פעיל ---------- */
function customQuestions(){ return Store.get(KEY_CUSTOM, []); }

function buildPool(){
  const pool = [];
  Object.keys(RAW).forEach(cat => {
    if (!state.cats.includes(cat)) return;
    RAW[cat].forEach((row, i) => pool.push({ id: cat + '-' + i, cat, q: row[0], a: row[1], opts: [row[1], row[2], row[3]] }));
  });
  if (state.useFamily){
    customQuestions().forEach((c, i) =>
      pool.push({ id: 'fam-' + i, cat: 'fam', q: c.q, a: c.a, opts: [c.a, c.w1, c.w2] }));
  }
  state.pool = shuffle(pool);
  state.used = new Set();
}

function nextQuestion(){
  if (!state.pool.length) buildPool();
  let q = state.pool.find(x => !state.used.has(x.id));
  if (!q){ state.used.clear(); q = state.pool[0]; }        // המאגר נגמר — מתחילים סבב חדש
  state.used.add(q.id);
  return { ...q, shuffled: shuffle(q.opts) };
}

/* ============================================================
   ניתוב מסכים
   ============================================================ */
const Screens = {};
function go(screen, data){
  clearAllTimers();
  OVR().innerHTML = '';
  state.screen = screen;
  const s = Screens[screen];
  APP().innerHTML = s.html(data);
  APP().scrollIntoView({ block:'start' });
  window.scrollTo(0, 0);
  if (s.mount) s.mount(data);
}
function onKeys(map){
  const h = e => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    const fn = map[e.key] || map[e.code];
    if (fn){ e.preventDefault(); fn(e); }
  };
  window.addEventListener('keydown', h);
  addCleanup(() => window.removeEventListener('keydown', h));
}
function bind(sel, ev, fn, root){
  $$(sel, root || document).forEach(el => el.addEventListener(ev, fn));
}

/* ---------- שכבות-על ---------- */
function overlay(html){
  OVR().innerHTML = `<div class="overlay" id="ovr"><div class="text-center rise">${html}</div></div>`;
  return $('#ovr');
}
function closeOverlay(){ OVR().innerHTML = ''; }

/* ספירה לאחור 3-2-1 לפני סבב */
function countdown(el, done){
  let n = 3;
  const paint = () => {
    el.innerHTML = `<div class="big logo pop" key="${n}">${n > 0 ? n : 'יוצאים לדרך!'}</div>`;
    Sound.beep();
  };
  paint();
  const iv = addInterval(() => {
    n--;
    if (n < 0){ clearInterval(iv); live.intervals.delete(iv); closeOverlay(); done(); return; }
    paint();
  }, T(800));
}

/* ---------- כותרת עליונה משותפת ---------- */
/* ============================================================
   כרטיס המנחה — התשובה הנכונה, לעיני מי שמחליט אם לאשר
   במצב 'host' התשובה גלויה מיד (המנחה מקריא את השאלה בקול);
   במצב 'shared', כשכולם רואים את המסך, היא מוסתרת עד לחיצה.
   ============================================================ */
const Judge = {
  answer: '', shown: false,

  html(){
    return `
    <div class="judgecard" id="judgecard">
      <button type="button" class="btn btn-icon" id="judge-peek">👁 הצג תשובה <span class="kbd">↑</span></button>
      <div class="row" id="judge-answer" hidden>
        <span class="chip" id="judge-label">התשובה</span>
        <b class="judgetext" id="judge-text"></b>
      </div>
    </div>`;
  },

  mount(){
    const peek = $('#judge-peek');
    if (peek) peek.addEventListener('click', () => this.reveal());
  },

  /* שאלה חדשה נשלפה */
  set(answer){
    this.answer = answer || '';
    this.shown = false;
    const text = $('#judge-text'), box = $('#judge-answer'), peek = $('#judge-peek');
    if (!text) return;
    text.textContent = this.answer;
    $('#judge-label').textContent = 'התשובה';
    $('#judge-label').className = 'chip';
    if (state.answerMode === 'shared'){
      box.hidden = true;
      if (peek) peek.hidden = false;
    } else {
      box.hidden = false;
      if (peek) peek.hidden = true;
      this.shown = true;
    }
  },

  /* הסתרה מפורשת — כשאין מה לשפוט (הצ׳ייסר הממוחשב עונה בעצמו) */
  hide(){
    const box = $('#judge-answer'), peek = $('#judge-peek');
    if (!box) return;
    box.hidden = true;
    if (peek) peek.hidden = true;
    this.shown = false;
  },

  /* חשיפה יזומה, וגם אחרי כל שיפוט — כדי שכולם ילמדו את התשובה */
  reveal(kind){
    const box = $('#judge-answer'), peek = $('#judge-peek');
    if (!box) return;
    box.hidden = false;
    if (peek) peek.hidden = true;
    this.shown = true;
    if (kind){
      const label = $('#judge-label');
      label.textContent = kind === 'ok' ? '✔ נכון' : '✘ התשובה הייתה';
      label.className = 'chip ' + (kind === 'ok' ? 'chip-gold' : 'chip-chaser');
    }
  }
};


function topBar(title, sub){
  return `
  <header class="spread mb-4">
    <div>
      <div class="eyebrow">${esc(sub || '')}</div>
      <h1 class="logo text-2xl sm:text-3xl font-black">${esc(title)}</h1>
    </div>
    <div class="row">
      <button class="btn" id="btn-sound" aria-label="הפעלה וכיבוי של הקול">${Sound.muted ? '🔇' : '🔊'}</button>
      <button class="btn" id="btn-quit">יציאה לתפריט</button>
    </div>
  </header>`;
}
function mountTopBar(){
  const s = $('#btn-sound');
  if (s) s.addEventListener('click', () => {
    Sound.init(); Sound.setMuted(!Sound.muted);
    s.textContent = Sound.muted ? '🔇' : '🔊';
    if (Sound.muted) Sound.musicStop();
  });
  /* יציאה בשני שלבים במקום חלונית מערכת — עובד גם במסגרת מוגבלת וגם בטלפון */
  const q = $('#btn-quit');
  if (q){
    let armed = false, revert = null;
    const reset = () => { armed = false; q.textContent = 'יציאה לתפריט'; q.classList.remove('btn-bad'); };
    q.addEventListener('click', () => {
      if (armed){ clearTimeout(revert); Sound.musicStop(); go('menu'); return; }
      armed = true;
      q.textContent = 'בטוח? לחצו שוב';
      q.classList.add('btn-bad');
      Sound.init(); Sound.beep();
      revert = addTimeout(reset, 3000);
    });
  }
}

<script>
/* ============================================================
   מסך 1 — תפריט ראשי

Screens.menu = {

      ${rule(3, 'המרדף הסופי', `

        אם הצ׳ייסר טועה — השעון נעצר, ואתם מקבלים הזדמנות <b>לדחוף אותו צעד אחורה</b>.`)}
      <div class="panel panel-pad">

          ב־<b>טריוויה משפחתית</b> אפשר להוסיף שאלות משלכם — והצ׳ייסר, למרבה השמחה, גרוע בהן.

/* ============================================================
   מסך 3 — יוצר השאלות המשפחתיות
   ============================================================ */
Screens.custom = {
  html(){
    return `
    ${topBar('טריוויה משפחתית', 'שאלות שאתם מוסיפים')}
    <div class="grid gap-3 lg:grid-cols-2">
      <form class="panel panel-pad grid gap-3" id="c-form">
        <b class="text-lg">הוספת שאלה</b>
        <label class="grid gap-1">
          <span class="muted text-sm">השאלה</span>
          <input class="field" id="c-q" required maxlength="160" placeholder="למשל: באיזו עיר נולדה סבתא רותי?">
        </label>
        <label class="grid gap-1">
          <span class="muted text-sm">התשובה הנכונה</span>
          <input class="field" id="c-a" required maxlength="60" placeholder="חיפה">
        </label>
        <div class="grid-2">
          <label class="grid gap-1">
            <span class="muted text-sm">תשובה שגויה 1</span>
            <input class="field" id="c-w1" required maxlength="60" placeholder="תל אביב">
          </label>
          <label class="grid gap-1">
            <span class="muted text-sm">תשובה שגויה 2</span>
            <input class="field" id="c-w2" required maxlength="60" placeholder="באר שבע">
          </label>
        </div>
        <button class="btn btn-gold btn-lg" type="submit">➕ הוספה למאגר</button>
        <p class="muted text-xs">
          השאלות נשמרות בדפדפן הזה בלבד. אפשר לייצא אותן (קובץ או העתקת טקסט) ולטעון אותן במכשיר אחר.
        </p>
      </form>

      <div class="panel panel-pad grid gap-3 content-start">
        <div class="spread">
          <b class="text-lg">המאגר שלכם <span class="chip chip-gold" id="c-count">0</span></b>
          <div class="row">
            <button class="btn" id="c-export">⬇ ייצוא</button>
            <button class="btn" id="c-import">⬆ ייבוא</button>
            <input type="file" accept="application/json,.json" id="c-file" class="hidden">
          </div>
        </div>
        <div id="c-msg" class="text-sm font-bold"></div>
        <textarea id="c-json" class="field hidden" rows="4" spellcheck="false"
                  placeholder="כאן יופיע ה-JSON לייצוא — או הדביקו כאן JSON כדי לייבא"></textarea>
        <div class="scroll grid gap-2" id="c-list"></div>
      </div>
    </div>
    <div class="mt-4 text-center row justify-center">
      <button class="btn btn-gold btn-lg" id="c-play">▶ למסך ההגדרות</button>
      <button class="btn btn-lg" id="c-back">חזרה לתפריט</button>
    </div>`;
  },
  mount(){
    mountTopBar();
    $('#btn-quit').classList.add('hidden');

    const paint = () => {
      const list = customQuestions();
      $('#c-count').textContent = list.length;
      $('#c-list').innerHTML = list.length
        ? list.map((c, i) => `
            <div class="panel panel-sm spread gap-2">
              <div class="min-w-0">
                <div class="font-bold truncate">${esc(c.q)}</div>
                <div class="muted text-xs">✔ ${esc(c.a)} · ${esc(c.w1)} · ${esc(c.w2)}</div>
              </div>
              <button class="btn btn-icon" data-del="${i}" aria-label="מחיקת שאלה">🗑</button>
            </div>`).join('')
        : `<p class="muted text-sm">עדיין אין שאלות משפחתיות. הוסיפו את הראשונה — הצ׳ייסר בקושי יודע עליכן משהו.</p>`;
      bind('[data-del]', 'click', e => {
        const i = +e.currentTarget.dataset.del;
        const l = customQuestions(); l.splice(i, 1); Store.set(KEY_CUSTOM, l);
        Sound.pass(); paint();
      });
    };
    paint();

    $('#c-form').addEventListener('submit', e => {
      e.preventDefault();
      const q  = $('#c-q').value.trim(), a = $('#c-a').value.trim();
      const w1 = $('#c-w1').value.trim(), w2 = $('#c-w2').value.trim();
      if (!q || !a || !w1 || !w2) return;
      const list = customQuestions();
      list.push({ q, a, w1, w2 });
      Store.set(KEY_CUSTOM, list);
      e.target.reset(); $('#c-q').focus();
      Sound.init(); Sound.correct();
      paint();
    });

    const say = (msg, bad) => {
      const el = $('#c-msg');
      el.textContent = msg;
      el.className = 'text-sm font-bold ' + (bad ? 'text-red-300' : 'text-green-300');
      addTimeout(() => { el.textContent = ''; }, 6000);
    };

    /* ייצוא: הטקסט להעתקה מוצג תמיד, כי הורדת קובץ חסומה בחלק מהסביבות.
       בדף מפורסם השמירה עוברת דרך ה-runtime ומבקשת אישור מהצופה. */
    $('#c-export').addEventListener('click', async () => {
      const json = JSON.stringify(customQuestions(), null, 2);
      const box = $('#c-json');
      box.value = json;
      box.classList.remove('hidden');
      box.focus(); box.select();
      say('העתיקו את הטקסט שלמטה — או שמרו כקובץ, אם הסביבה מאפשרת.');

      let downloads = null;
      try { downloads = (window.claude && claude.use) ? await claude.use('downloads') : null; } catch(err){ downloads = null; }
      if (downloads){
        try {
          await downloads.save({ filename:'chase-family-questions.json', data: json });
          say('הקובץ נשמר.');
        } catch(err){ /* הצופה ביטל — הטקסט למעלה עדיין זמין להעתקה */ }
        return;
      }
      try {
        const blob = new Blob([json], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'chase-family-questions.json';
        document.body.appendChild(a); a.click(); a.remove();
        addTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch(err){ /* הטקסט למעלה הוא הדרך החלופית */ }
    });

    $('#c-import').addEventListener('click', () => $('#c-file').click());
    const loadJson = text => {
      try {
        const data = JSON.parse(text);
        if (!Array.isArray(data)) throw 0;
        const ok = data.filter(x => x && x.q && x.a && x.w1 && x.w2)
                       .map(x => ({ q:String(x.q), a:String(x.a), w1:String(x.w1), w2:String(x.w2) }));
        if (!ok.length) return say('לא נמצאו שאלות תקינות בקובץ.', true);
        Store.set(KEY_CUSTOM, customQuestions().concat(ok));
        paint(); Sound.correct();
        say(`נוספו ${ok.length} שאלות.`);
      } catch(err){ say('הטקסט אינו בפורמט הנכון.', true); }
    };
    $('#c-file').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => loadJson(r.result);
      r.readAsText(f);
      e.target.value = '';
    });
    /* הדבקת JSON ישירות לתיבה — הדרך היחידה לייבא כשאין גישה לקבצים */
    $('#c-json').addEventListener('paste', e => {
      addTimeout(() => { if ($('#c-json').value.trim()) loadJson($('#c-json').value); }, 60);
    });

    $('#c-play').addEventListener('click', () => go('setup'));
    $('#c-back').addEventListener('click', () => go('menu'));
  }
};

Screens.setup = {
  html(){
    const saved = Store.get(KEY_SETTINGS, {});
    const names = saved.names || ['', '', '', ''];
    const count = saved.count || 2;
    const lvl   = saved.level || 'medium';
    const host  = saved.hostMode || 'ai';
    const ansMode = saved.answerMode || 'host';
    const cats  = saved.cats || Object.keys(CATS).filter(k => k !== 'fam');
    const famN  = customQuestions().length;

    const playerRow = i => `
      <div class="row gap-2" data-prow="${i}">
        <span class="chip chip-player">${i + 1}</span>
        <input class="field flex-1" data-name="${i}" maxlength="14"
               placeholder="שם השחקן/ית" value="${esc(names[i] || '')}">
      </div>`;

    const lvlCard = c => `
      <button type="button" class="card-pick ${lvl === c.key ? 'on' : ''}" data-lvl="${c.key}">

    return `
    ${topBar('הגדרות המשחק', 'לפני שמתחילים')}

      <div class="panel panel-pad grid gap-3 content-start">
        <b class="text-lg">מי משחק?</b>
        <div class="row" role="group" aria-label="מספר שחקנים">
          ${[1,2,3,4].map(n => `<button type="button" class="btn ${count === n ? 'btn-gold' : ''}" data-count="${n}">${n}</button>`).join('')}

        </div>
        <div class="grid gap-2" id="s-players">${[0,1,2,3].map(playerRow).join('')}</div>
      </div>

      <div class="panel panel-pad grid gap-3 content-start">
        <b class="text-lg">מי מנהל את הצ׳ייסר?</b>
        <div class="grid-2">
          <button type="button" class="card-pick ${host === 'ai' ? 'on' : ''}" data-host="ai">
            <div class="row"><span class="text-2xl">🤖</span><b>צ׳ייסר ממוחשב</b></div>
            <div class="muted text-sm mt-1">המחשב עונה בעצמו לפי רמת הקושי.</div>
          </button>
          <button type="button" class="card-pick ${host === 'human' ? 'on' : ''}" data-host="human">
            <div class="row"><span class="text-2xl">🎤</span><b>מנחה אנושי</b></div>
            <div class="muted text-sm mt-1">אחד מכם משחק את הצ׳ייסר ובוחר את תשובותיו.</div>
          </button>
        </div>
        <b class="text-lg mt-1">מי רואה את התשובה?</b>
        <div class="grid-2">
          <button type="button" class="card-pick ${ansMode === 'host' ? 'on' : ''}" data-ansmode="host">
            <div class="row"><span class="text-2xl">📱</span><b>המכשיר ביד המנחה</b></div>
            <div class="muted text-sm mt-1">התשובה מוצגת מתחת לשאלה. מקריאים בקול ומשפטים מיד.</div>
          </button>
          <button type="button" class="card-pick ${ansMode === 'shared' ? 'on' : ''}" data-ansmode="shared">

            <div class="muted text-sm mt-1">התשובה מוסתרת עד שלוחצים "הצג תשובה".</div>

        </div>
        <b class="text-lg mt-1">נושאים</b>
        <div class="grid-2" id="s-cats">${Object.keys(RAW).map(catBox).join('')}</div>
        <label class="pick ${famN ? '' : 'opacity-50'}" id="s-fambox">
          <input type="checkbox" id="s-fam" ${famN ? 'checked' : ''} ${famN ? '' : 'disabled'}>
          <span>${CATS.fam.icon} ${esc(CATS.fam.name)}</span>
          <span class="muted text-xs mr-auto">${famN}</span>
        </label>
      </div>

      <div class="panel panel-pad grid gap-3 lg:col-span-2">
        <b class="text-lg">רמת הצ׳ייסר</b>
        <div class="grid-3" id="s-lvls">${Object.values(CHASERS).map(lvlCard).join('')}</div>
      </div>
    </div>

    <div class="mt-4 text-center grid gap-2 justify-center">
      <button class="btn btn-gold btn-xl glow px-10" id="s-start">▶ מתחילים!</button>
      <button class="btn btn-ghost" id="s-back">חזרה לתפריט</button>

  mount(){
    mountTopBar();
    $('#btn-quit').classList.add('hidden');

    let host  = saved.hostMode || 'ai';
    let ansMode = saved.answerMode || 'host';

    const paintCount = () => {
      $$('[data-count]').forEach(b => b.classList.toggle('btn-gold', +b.dataset.count === count));
      $$('[data-prow]').forEach(r => r.classList.toggle('hidden', +r.dataset.prow >= count));

    bind('[data-count]', 'click', e => { count = +e.currentTarget.dataset.count; Sound.init(); Sound.beep(); paintCount(); });

    bind('[data-lvl]', 'click', e => {
      level = e.currentTarget.dataset.lvl;
      $$('[data-lvl]').forEach(b => b.classList.toggle('on', b.dataset.lvl === level));
      Sound.init(); Sound.beep();
    });
    bind('[data-host]', 'click', e => {
      host = e.currentTarget.dataset.host;
      $$('[data-host]').forEach(b => b.classList.toggle('on', b.dataset.host === host));
      Sound.init(); Sound.beep();
    });
    bind('[data-ansmode]', 'click', e => {
      ansMode = e.currentTarget.dataset.ansmode;
      $$('[data-ansmode]').forEach(b => b.classList.toggle('on', b.dataset.ansmode === ansMode));
      Sound.init(); Sound.beep();
    });
    bind('[data-cat]', 'change', e => {
      e.currentTarget.closest('label').classList.toggle('on', e.currentTarget.checked);
    });

    $('#s-start').addEventListener('click', () => {
      const cats = $$('[data-cat]').filter(c => c.checked).map(c => c.dataset.cat);

      const names = $$('[data-name]').map(i => i.value.trim());
      const players = [];
      for (let i = 0; i < count; i++)
        players.push({ id: i, name: names[i] || `שחקן ${i + 1}`, bank: 0, status:'pending', offer: null });

      state.players   = players;
      state.current   = 0;
      state.chaser    = CHASERS[level];
      state.hostMode  = host;
      state.answerMode = ansMode;
      state.cats      = cats;
      state.useFamily = $('#s-fam').checked && customQuestions().length > 0;
      state.teamBank  = 0;
      buildPool();

      Store.set(KEY_SETTINGS, { ...Store.get(KEY_SETTINGS, {}), names, count, level, hostMode: host, answerMode: ansMode, cats });
      Sound.init(); Sound.offer();
      go('ready');
    });
    $('#s-back').addEventListener('click', () => go('menu'));
  }
};

}

  },
  mount(){

      const el = overlay('<div class="big logo">3</div>');
      countdown(el.firstElementChild, () => go('cash'));
    };
    $('#go').addEventListener('click', start);
    onKeys({ Enter: start, ' ': start });
  }
};

Screens.cash = {
  html(){
    const p = state.players[state.current];
    return `
    ${topBar('צבירת כסף', esc(p.name))}
    <div class="grid gap-3">
      <div class="panel panel-pad spread">
        <div class="row">
          <div class="ring" id="ring" style="--p:100"><b id="clock">${CASH_SECONDS}</b></div>
          <div>
            <div class="eyebrow">הקופה של ${esc(p.name)}</div>
            <div class="money text-4xl sm:text-5xl text-yellow-300" id="bank">${money(0)}</div>
            <div class="muted text-sm" id="tally">0 נכונות · 0 שגויות · 0 דילוגים</div>
          </div>
        </div>
        <div class="text-left muted text-sm only-sm">
          <div>1,000 ₪ לכל תשובה נכונה</div>
          <div class="mt-1">שאלה <b id="qn" class="num">1</b></div>
        </div>
      </div>

      <div class="panel panel-pad qbox grid content-center gap-3" id="qcard" aria-live="polite">
        <div class="row"><span class="chip" id="qcat">—</span></div>
        <div class="qtext" id="q">…</div>
        ${Judge.html()}
      </div>

      <div class="grid gap-2 sm:grid-cols-3">
        <button class="btn btn-ok btn-xl" id="b-ok">✔ נכון <span class="kbd">←</span></button>
        <button class="btn btn-bad btn-xl" id="b-no">✘ לא נכון <span class="kbd">→</span></button>
        <button class="btn btn-xl" id="b-pass">↷ דלג <span class="kbd">רווח</span></button>
      </div>
    </div>`;
  },

  mount(){
    mountTopBar();
    const p = state.players[state.current];
    const st = state.cash = { bank:0, right:0, wrong:0, passed:0, asked:0, q:null, passQueue:[], locked:false };

    const ring = $('#ring'), clockEl = $('#clock');
    const draw = () => {
      st.asked++;
      $('#qn').textContent = st.asked;
      /* שאלה שדולגה חוזרת אחרי כמה שאלות */
      st.q = (st.passQueue.length && st.asked % 4 === 0) ? st.passQueue.shift() : nextQuestion();
      $('#qcat').textContent = CATS[st.q.cat].icon + ' ' + CATS[st.q.cat].name;
      $('#q').textContent = st.q.q;
      Judge.set(st.q.a);
      st.locked = false;
    };

    const tally = () => {
      $('#bank').textContent = money(st.bank);
      $('#tally').textContent = `${st.right} נכונות · ${st.wrong} שגויות · ${st.passed} דילוגים`;
    };

    const judge = kind => {
      if (st.locked || !clock.running) return;
      st.locked = true;
      const card = $('#qcard');
      if (kind === 'ok'){
        st.right++; st.bank += 1000; Sound.correct();
        card.classList.remove('flash-bad'); card.classList.add('flash-ok');
        Judge.reveal('ok');
      } else if (kind === 'no'){
        st.wrong++; Sound.wrong();
        card.classList.remove('flash-ok'); card.classList.add('flash-bad');
        Judge.reveal('no');
      } else {
        st.passed++; st.passQueue.push(st.q); Sound.pass();
      }
      tally();
      addTimeout(() => {
        card.classList.remove('flash-ok', 'flash-bad');
        if (clock.running) draw();
      }, T(kind === 'no' ? 750 : 350));
    };

    const clock = new Clock(CASH_SECONDS * 1000, {
      onTick: left => { ring.style.setProperty('--p', (left / (CASH_SECONDS * 1000)) * 100); },
      onSecond: s => {
        clockEl.textContent = s;
        if (s <= 10){ ring.classList.add('urgent'); Sound.tick(true); }
        else Sound.tick(false);
      },
      onEnd: () => {
        Sound.musicStop(); Sound.timeUp();
        ['#b-ok', '#b-no', '#b-pass'].forEach(s => { $(s).disabled = true; });
        p.bank = st.bank;
        overlay(`
          <div class="eyebrow mb-2">נגמר הזמן</div>
          <div class="logo big">${money(st.bank)}</div>
          <div class="muted mt-3">${esc(p.name)} · ${st.right} תשובות נכונות</div>`);
        addTimeout(() => go('offer'), T(2400));
      }
    });

    $('#b-ok').addEventListener('click', () => judge('ok'));
    $('#b-no').addEventListener('click', () => judge('no'));
    $('#b-pass').addEventListener('click', () => judge('pass'));
    Judge.mount();
    onKeys({
      ArrowUp:    () => Judge.reveal(),
      ArrowLeft:  () => judge('ok'),
      ArrowRight: () => judge('no'),
      ' ':        () => judge('pass'),
      '1':        () => judge('ok'),
      '2':        () => judge('no'),
      '3':        () => judge('pass')
    });

    tally(); draw(); clock.start();
  }
};

/* ============================================================
   מסך 7 — ההצעות של הצ׳ייסר
   ============================================================ */
function makeOffers(bank, chaser){
  const mid  = bank;
  const low  = bank === 0 ? 1000 : Math.max(500, Math.round(bank * 0.25 / 500) * 500);
  const high = Math.max(chaser.mult * 2500, Math.round(bank * chaser.mult / 1000) * 1000);
  return { low, mid, high };
}

function miniBoard(pos){
  let rows = '';
  for (let i = 0; i <= HOME; i++){
    const who = i === 0 ? '🔴' : i === pos ? '🔵' : i === HOME ? '🏠' : '';
    rows += `<div class="step ${i === pos ? 'team' : ''} ${i === 0 ? 'caught' : ''} ${i === HOME ? 'homestep' : ''}"
                  style="height:16px">${who}</div>`;
  }
  return `<div class="ladder" style="flex-direction:column">${rows}</div>`;
}

Screens.offer = {
  html(){
    const p = state.players[state.current];
    const o = makeOffers(p.bank, state.chaser);
    p.offers = o;
    const card = (key, amount, label, note, disabled) => `
      <button type="button" class="card-pick ${disabled ? '' : ''} grid gap-2" data-offer="${key}" ${disabled ? 'disabled style="opacity:.4;cursor:not-allowed"' : ''}>
        <div class="chip ${key === 'high' ? 'chip-chaser' : key === 'low' ? 'chip-player' : 'chip-gold'}">${label}</div>
        <div class="money text-3xl ${key === 'high' ? 'text-red-300' : key === 'low' ? 'text-sky-300' : 'text-yellow-300'}">${money(amount)}</div>
        <div class="muted text-sm">${note}</div>
        ${miniBoard(START_POS[key])}
        <div class="muted text-xs">${HOME - START_POS[key]} תשובות נכונות עד הבית</div>
      </button>`;
    return `
    ${topBar('המרדף האישי', esc(p.name) + ' מול הצ׳ייסר')}
    <div class="panel panel-pad text-center mb-3">
      <div class="eyebrow">צברתם</div>
      <div class="logo text-5xl">${money(p.bank)}</div>
      <p class="muted mt-2 max-w-xl mx-auto">
        ${state.chaser.emoji} <b>${esc(state.chaser.title)}</b> מציע לכם עסקה.
        הצעה גבוהה = הרבה יותר כסף, אבל מתחילים צעד אחד קרוב יותר אליו.
      </p>
    </div>
    <div class="grid-3">
      ${card('low',  o.low,  'הצעה נמוכה', 'מתחילים צעד קרוב יותר לבית — בטוח יותר.', false)}
      ${card('mid',  o.mid,  'הסכום שצברתם', 'ההתחלה הרגילה, באמצע הלוח.', p.bank === 0)}
      ${card('high', o.high, 'הצעה גבוהה', 'מתחילים צעד קרוב יותר לצ׳ייסר — מסוכן.', false)}
    </div>
    <p class="muted text-center text-sm mt-4">בחרו הצעה כדי להתחיל את המרדף.</p>`;
  },
  mount(){
    mountTopBar();
    Sound.offer();
    bind('[data-offer]', 'click', e => {
      const key = e.currentTarget.dataset.offer;
      const p = state.players[state.current];
      const o = makeOffers(p.bank, state.chaser);
      p.offer = { key, prize: o[key], start: START_POS[key] };
      Sound.lock();
      go('chase');
    });
  }
};
